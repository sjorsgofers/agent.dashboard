<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Network – Live Dashboard</title>
<style>
:root { --bg:#0b1220; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --green:#22c55e; --yellow:#eab308; --red:#ef4444; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
.app { display:none; grid-template-columns:200px 1fr; height:100vh; }
.app.visible { display:grid; }
.sidebar { background:#0f172a; border-right:1px solid var(--border); padding:16px 10px; }
.logo { font-weight:700; padding:8px 12px 16px; }
.header { height:56px; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:12px; background:#0f172a; }
.canvas { flex:1; overflow:auto; position:relative; padding:30px; }
.node { position:absolute; background:#1e293b; border:1px solid var(--border); border-radius:10px; padding:10px 14px; cursor:pointer; font-size:13px; }
.manager { font-weight:600; min-width:140px; text-align:center; }
.agent { min-width:110px; font-size:12px; }
.status-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; }
.legend { position:absolute; bottom:16px; left:16px; background:#111827ee; border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:12px; }
.calendar { position:absolute; top:16px; right:16px; width:280px; background:#111827ee; border:1px solid var(--border); border-radius:10px; padding:14px; }
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;background:#0b1220;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:#111827;padding:28px;border-radius:14px;border:1px solid #334155;width:300px;text-align:center;">
    <h2 style="margin-bottom:14px">AI Agent Network</h2>
    <input id="pw" type="password" placeholder="Wachtwoord" style="width:100%;padding:9px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;margin-bottom:10px;">
    <button onclick="checkPw()" style="width:100%;padding:9px;border-radius:7px;background:#7c3aed;color:#fff;border:none;cursor:pointer;">Toegang</button>
    <div id="err" style="color:#ef4444;font-size:12px;margin-top:6px;display:none;">Onjuist wachtwoord</div>
  </div>
</div>
<div class="app" id="app">
  <aside class="sidebar"><div class="logo">⚡ Agent Network</div></aside>
  <div>
    <header class="header">
      <strong>Live Dashboard</strong>
      <span id="last-update" style="color:#94a3b8;font-size:12px;margin-left:auto"></span>
    </header>
    <div class="canvas" id="canvas">
      <div id="graph" style="position:relative;min-height:800px"></div>
      <div class="legend">
        <div><span style="color:#22c55e">●</span> Healthy</div>
        <div><span style="color:#eab308">●</span> Attention</div>
        <div><span style="color:#ef4444">●</span> Error</div>
      </div>
      <div class="calendar" id="calendar"><strong>📅 Agenda</strong><div id="events" style="margin-top:8px;font-size:12px"></div></div>
    </div>
  </div>
</div>
<script>
const PW_HASH = "5449a87082ae824fc5e05bb9fb0ba664710b69168c2ff737cc0ae5a15a9cda1f";
async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
async function checkPw() {
  if (await sha256(document.getElementById("pw").value) === PW_HASH) {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").classList.add("visible");
    load();
    setInterval(load, 20000);
  } else document.getElementById("err").style.display = "block";
}
let data = { groups: [] };
async function load() {
  try {
    const res = await fetch("status.json?t=" + Date.now());
    if (!res.ok) return;
    data = await res.json();
    document.getElementById("last-update").textContent = data.updated ? "Updated: " + new Date(data.updated).toLocaleTimeString("nl-NL") : "";
    render();
  } catch(e) { console.warn(e); }
}
function render() {
  const g = document.getElementById("graph");
  g.innerHTML = "";
  if (!data.groups || data.groups.length === 0) {
    g.innerHTML = "<div style='padding:40px;color:#94a3b8'>Nog geen agents gekoppeld. Laat de Chief of Staff status.json bijwerken.</div>";
    return;
  }
  data.groups.forEach((group, i) => {
    const gx = 40 + i * 280;
    const m = document.createElement("div");
    m.className = "node manager";
    m.style.left = gx + "px";
    m.style.top = "40px";
    m.innerHTML = `<span class="status-dot" style="background:${color(group.status)}"></span>${group.name}`;
    g.appendChild(m);
    (group.agents || []).forEach((a, j) => {
      const el = document.createElement("div");
      el.className = "node agent";
      el.style.left = (gx - 10 + (j % 2) * 150) + "px";
      el.style.top = (140 + Math.floor(j / 2) * 55) + "px";
      el.innerHTML = `<span class="status-dot" style="background:${color(a.status)}"></span>${a.name}`;
      g.appendChild(el);
    });
  });
}
function color(s) { return s === "healthy" ? "#22c55e" : s === "attention" ? "#eab308" : "#ef4444"; }
document.getElementById("events").innerHTML = "<div style='color:#64748b'>Agenda wordt geladen wanneer beschikbaar</div>";
</script>
</body>
</html>
