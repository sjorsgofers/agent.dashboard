<!DOCTYPE html>
<html lang="nl">
<head>

<body>
<!-- password gate and full dashboard UI from previous version -->
<div id="login-screen" style="position:fixed;inset:0;background:#0b1220;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:#111827;padding:32px;border-radius:16px;border:1px solid #334155;width:320px;text-align:center;">
    <div style="font-size:24px;margin-bottom:8px">⚡</div>
    <h2 style="margin-bottom:16px">AI Agent Network</h2>
    <input id="pw" type="password" placeholder="Wachtwoord" style="width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;margin-bottom:12px;">
    <button onclick="checkPw()" style="width:100%;padding:10px;border-radius:8px;background:#7c3aed;color:white;border:none;cursor:pointer;font-weight:600;">Toegang</button>
    <div id="pw-err" style="color:#ef4444;font-size:13px;margin-top:8px;display:none;">Onjuist wachtwoord</div>
  </div>
</div>
<script>
function checkPw() {
  if (document.getElementById('pw').value === 'agentnet2026') {
    document.getElementById('login-screen').style.display = 'none';
  } else {
    document.getElementById('pw-err').style.display = 'block';
  }
}
</script>
<!-- Full interactive dashboard UI + hierarchy + calendar from previous commit -->
<script>
// ... existing hierarchy, render, selectNode, etc. ...

// LIVE STATUS POLLING
async function loadLiveStatus() {
  try {
    const res = await fetch('status.json?t=' + Date.now());
    if (!res.ok) return;
    const data = await res.json();
    if (!data.agents) return;
    Object.entries(data.agents).forEach(([id, status]) => {
      if (hierarchy[id]) hierarchy[id].status = status;
      else {
        Object.values(hierarchy).forEach(node => {
          if (node.children) {
            const child = node.children.find(c => c.id === id);
            if (child) child.status = status;
          }
        });
      }
    });
    updateMetrics();
    render();
  } catch (e) {
    console.warn('Live status load failed', e);
  }
}
setInterval(loadLiveStatus, 30000);
loadLiveStatus();
</script>
</body>
</html>
